<!doctype html><meta charset="utf-8">
<style>
body{font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;color:#334155;font-size:60px;padding:20px;line-height:1.6;background:#fff}
b{font-size:16px;font-weight:600;color:#94a3b8;font-family:monospace}
.ref{display:inline-block;width:120px;height:2px;background:#ef4444;vertical-align:middle}
.f{text-align:center;line-height:1.05;margin:0 .15em;font-size:.84em}
.n{border-bottom:1.2px solid currentColor;padding:0 .3em .08em}
.d{padding:.16em .3em 0}
.v1{display:inline-grid;grid-template-rows:1fr 1fr;vertical-align:middle}
.v1 .n{align-self:end}.v1 .d{align-self:start}
.v4{display:inline-block;vertical-align:middle}
.v4 .n,.v4 .d{display:block}
</style>
