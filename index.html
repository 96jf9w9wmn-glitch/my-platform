<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Precettore" />
    <meta name="theme-color" content="#eef0f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <title>Precettore</title>
    <!-- Тему ставим ДО первого кадра: иначе тёмный пользователь видит вспышку
         светлого фона, пока грузится бандл и React успеет добавить .dark. -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
      // Страховка: если бандл не выполнился (ошибка загрузки), стартовый экран
      // не должен остаться навсегда поверх страницы.
      setTimeout(function () {
        var s = document.getElementById("splash");
        if (s) s.remove();
      }, 8000);
    </script>
    <!-- Стартовый экран: у PWA в standalone первый кадр иначе пустой. Стили
         инлайновые — они должны работать до загрузки index.css. Снимает его
         main.jsx после первого рендера React.
         Композиция ровно та же, что у экрана загрузки в App.jsx (логотип 64px +
         подпись), чтобы переход splash → React не читался как «мигнуло». -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: #eef0f8;
        /* Появляется с задержкой: при быстрой загрузке (кэш, обычное обновление)
           экран не успевает проявиться и не мелькает — видно сразу приложение. */
        opacity: 0;
        animation: splash-in 0.2s ease 0.25s both;
        transition: opacity 0.22s ease;
      }
      html.dark #splash { background: #0a0a0c; }
      #splash img {
        width: 64px; height: 64px; border-radius: 16px;
        box-shadow: 0 10px 28px rgba(0, 122, 255, 0.22);
        animation: splash-breathe 1.9s ease-in-out infinite;
      }
      #splash .cap {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
        color: #9ca3af;
        animation: splash-cap 2.4s ease-in-out infinite;
      }
      @keyframes splash-in { to { opacity: 1; } }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50%      { transform: scale(1.06); opacity: 1; }
      }
      @keyframes splash-cap {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.75; }
      }
      #splash.splash-off { opacity: 0 !important; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .cap { animation: none; }
        #splash { animation-duration: 0.01s; transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo.webp" alt="" width="64" height="64" />
      <div class="cap">Precettore</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
