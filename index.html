<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Precettore" />
    <meta name="theme-color" content="#eef0f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <title>Precettore</title>
    <!-- Тему ставим ДО первого кадра: иначе тёмный пользователь видит вспышку
         светлого фона, пока грузится бандл и React успеет добавить .dark. -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
      // Страховка: если бандл не выполнился (ошибка загрузки), стартовый экран
      // не должен остаться навсегда поверх страницы.
      setTimeout(function () {
        var s = document.getElementById("splash");
        if (s) s.remove();
      }, 8000);
    </script>
    <!-- Стартовый экран: у PWA в standalone первый кадр иначе пустой. Стили
         инлайновые — они должны работать до загрузки index.css. Снимает его
         main.jsx после первого рендера React. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #eef0f8;
        transition: opacity 0.22s ease;
      }
      html.dark #splash { background: #0a0a0c; }
      #splash img { width: 72px; height: 72px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12); }
      #splash .ring {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.12); border-top-color: #007aff;
        animation: splash-spin 0.8s linear infinite;
      }
      html.dark #splash .ring { border-color: rgba(255, 255, 255, 0.16); border-top-color: #0a84ff; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      #splash.splash-off { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #splash .ring { animation: none; }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo.webp" alt="" width="72" height="72" />
      <div class="ring"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
