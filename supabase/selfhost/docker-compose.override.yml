# Публикация портов только на localhost.
# Docker вставляет свои правила в iptables ДО ufw, поэтому публикация на
# 0.0.0.0 была бы доступна из интернета несмотря на "ufw default deny".
# Наружу отвечает только Caddy (80/443); к Postgres и пулеру — SSH-туннелем.
services:
  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"
  kong:
    ports: !override
      - "127.0.0.1:8000:8000"
  auth:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Precettore — сброс пароля"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Precettore — подтверждение адреса"
      GOTRUE_MAILER_SUBJECTS_INVITE: "Precettore — приглашение"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Precettore — смена адреса"
      GOTRUE_MAILER_TEMPLATES_RECOVERY: "https://db.precettore.ru/email/recovery.html"

  # SMTP-релей в сети ХОСТА. Провайдер не пропускает SMTP-трафик из docker-сети:
  # из контейнера connect к smtp.mail.ru:587 висит по таймауту, тогда как с хоста
  # те же адреса отвечают, а HTTPS из контейнера работает. Настройками Docker это
  # не лечится (проверены MTU, IPv6, порты 25/465/587) — фильтрация на стороне
  # сети провайдера. Поэтому письмо уходит в два шага: GoTrue отдаёт его релею на
  # 172.17.0.1, а релей отправляет наружу уже из хостовой сети.
  # Порт 587 слушается на всех интерфейсах, но снаружи закрыт ufw.
  smtp-relay:
    image: boky/postfix
    container_name: supabase-smtp-relay
    network_mode: host
    restart: unless-stopped
    environment:
      RELAYHOST: "smtp.mail.ru:587"
      RELAYHOST_USERNAME: "precettore@inbox.ru"
      RELAYHOST_PASSWORD: "<пароль приложения>"
      RELAYHOST_TLS_LEVEL: "encrypt"
      ALLOWED_SENDER_DOMAINS: "inbox.ru"
      # На входе TLS не объявляем: соединение GoTrue -> релей не покидает
      # машину, а самоподписанный сертификат релея (CN=localhost) GoTrue
      # всё равно отвергает. Наружу релей шлёт с обязательным шифрованием
      # (RELAYHOST_TLS_LEVEL=encrypt) — там TLS как раз нужен.
      POSTFIX_smtpd_tls_security_level: "none"
      POSTFIX_smtpd_use_tls: "no"
      # GoTrue не ставит Message-ID и Date, а Postfix при приёме по SMTP
      # своих не добавляет — в логе это видно как «message-id=<>».
      # Письмо без Message-ID спам-фильтры отбрасывают молча: сервер
      # отвечает 250 OK, а до ящика оно не доходит.
      POSTFIX_always_add_missing_headers: "yes"
      # Иначе Message-ID получает домен «precettore-db» — внутреннее имя
      # сервера, которого нет в DNS. Для спам-фильтров это лишний минус.
      POSTFIX_myhostname: "precettore.ru"
